name: Sync Facebook photos

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-facebook-photos
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync photos from Facebook
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: node scripts/sync-facebook-photos.js

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/images/nails src/_data/nailsGallery.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync Facebook-Fotos"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Keine neuen Facebook-Fotos."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Pushes mit dem GITHUB_TOKEN lösen keine weiteren Workflows aus
      # (GitHub-Actions-Beschränkung). workflow_dispatch ist davon
      # ausgenommen, also stoßen wir den Deploy hier explizit an.
      - name: Trigger deploy workflow
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
